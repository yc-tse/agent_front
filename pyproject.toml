[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-audit-front"
version = "0.1.0"
description = "Streamlit front-end for the internal-audit mission-preparation agent (human-in-the-loop)."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.49",     # UI runtime (needs the `width=` layout API)
    "pydantic>=2.6",       # tolerant parsing of backend payloads
    "httpx>=0.27",         # backend HTTP client (timeouts, retries, polling)
    "python-dotenv>=1.0",  # local .env loading outside Streamlit secrets
    "pandas>=2.0",         # tabular views of loss events and recommendations
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
audit_front = ["example_data/*.json"]
